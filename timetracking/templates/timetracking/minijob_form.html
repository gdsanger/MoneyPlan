{% extends "base.html" %}
{% load crispy_forms_tags %}
{% block title %}Minijob-Einsatz - MoneyPlan{% endblock %}
{% block content %}
<div class="row"><div class="col-12 col-lg-6 offset-lg-3"><div class="card">
    <div class="card-header"><h5 class="mb-0">{% if shift %}Einsatz bearbeiten{% else %}Einsatz erfassen{% endif %}</h5></div>
    <div class="card-body">
        <form method="post">{% csrf_token %}
            {{ form|crispy }}
            <div class="d-flex justify-content-end gap-2 mt-3">
                <a href="{% url 'timetracking:minijob' %}" class="btn btn-secondary">Abbrechen</a>
                <button class="btn btn-primary"><i class="bi bi-save"></i> Speichern</button>
            </div>
        </form>
    </div>
</div></div></div>
{% endblock %}
