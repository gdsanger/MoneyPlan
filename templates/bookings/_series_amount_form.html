{% load crispy_forms_tags %}

<form method="post" hx-post="{% url 'bookings:series_amount_change' series.id %}">
    {% csrf_token %}
    <p class="text-muted">
        Der neue Betrag gilt für alle geplanten, noch nicht gebuchten Buchungen der Serie „{{ series.description }}“
        ab dem gewählten Datum. Bereits gebuchte und frühere Buchungen bleiben unverändert.
    </p>
    {% crispy form %}
    <div class="mt-3">
        <button type="submit" class="btn btn-primary">
            <i class="bi bi-save"></i> Speichern
        </button>
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
            <i class="bi bi-x-circle"></i> Abbrechen
        </button>
    </div>
</form>
