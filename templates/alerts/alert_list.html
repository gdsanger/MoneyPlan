{% extends "base.html" %}

{% block title %}Alerts - MoneyPlan{% endblock %}

{% block content %}
<div class="container-fluid">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1>
            <i class="bi bi-bell"></i> Alerts & Fälligkeiten
        </h1>
        <div>
            <button type="button"
                    class="btn btn-outline-secondary"
                    hx-post="{% url 'alerts:run' %}"
                    hx-target="#alert-list-container"
                    hx-swap="innerHTML"
                    hx-indicator="#run-check-indicator">
                <i class="bi bi-arrow-repeat"></i> Jetzt prüfen
                <span id="run-check-indicator" class="htmx-indicator spinner-border spinner-border-sm ms-1" role="status"></span>
            </button>
            <a href="{% url 'alerts:settings' %}" class="btn btn-primary">
                <i class="bi bi-gear"></i> Einstellungen
            </a>
        </div>
    </div>

    <div id="alert-list-container"
         hx-get="{% url 'alerts:list' %}"
         hx-trigger="every 60s"
         hx-swap="innerHTML">
        {% include "alerts/_alert_table.html" %}
    </div>
</div>
{% endblock %}
